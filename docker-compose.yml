services:
  mongodb:
    image: mongo:7
    container_name: scamshield-mongodb
    restart: unless-stopped

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: scamshield

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongodb-keyfile:/etc/mongo-keyfile:ro

volumes:
  mongodb_data:
